
name: Build JARVIS APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract Android project
        run: |
          mkdir source
          unzip jarvis-ai.zip -d source

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-36" "platforms;android-36-ext1" "build-tools;36.0.0"

      - name: Prepare signing key
        run: |
          keytool -genkeypair -keystore source/debug.keystore \
            -storepass android -alias androiddebugkey \
            -keypass android -dname "CN=Android Debug" \
            -keyalg RSA -keysize 2048 -validity 10000

      - name: Build APK
        run: |
          cd source
          gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-APK
          path: source/app/build/outputs/apk/debug/*.apk
          
