
name: Build JARVIS APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Accept Android licenses
        run: |
          SDKMANAGER=$(command -v sdkmanager || find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)
          yes | "$SDKMANAGER" --licenses

      - 
      - name: Install Android SDK
        run: |
          SDKMANAGER=$(command -v sdkmanager || find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
          
      - name: Extract Project
        run: |
          mkdir source
          unzip -o jarvis-ai.zip -d source

      - name: Create Debug Key
        run: |
          keytool -genkeypair -keystore source/debug.keystore \
            -storepass android -alias androiddebugkey \
            -keypass android -dname "CN=Android Debug" \
            -keyalg RSA -keysize 2048 -validity 10000

      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug
        working-directory: source

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-APK
          path: source/app/build/outputs/apk/debug/*.apk
          
